[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "signalmoat"
version = "0.3.0"
description = "Open-source agent firewall and early-warning layer for web apps: verify AI agents, enforce per-agent policies, detect hijacked sessions and credential stuffing."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Siddharth" }]
keywords = ["security", "bot-detection", "ai-agents", "web-bot-auth", "asgi", "fastapi", "waf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
server = ["uvicorn>=0.30"]
dev = [
  "uvicorn>=0.30",
  "pytest>=8",
  "fastapi>=0.110",
  "http-message-signatures>=0.5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
signalmoat = "signalmoat.cli:main"

[project.urls]
Repository = "https://github.com/XSiddhSaraf/signalmoat"
Issues = "https://github.com/XSiddhSaraf/signalmoat/issues"
Changelog = "https://github.com/XSiddhSaraf/signalmoat/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/scripts", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/signalmoat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
