name: Release

# Publishes every package when a version tag is pushed:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# No long-lived secrets are stored anywhere: PyPI, npm and NuGet each trust this
# workflow directly ("trusted publishing", via short-lived OIDC tokens), and the
# container image is pushed with the run's own GitHub token.
#
# A registry is only published to once you switch it on with a repository
# variable (Settings > Secrets and variables > Actions > Variables):
#     PUBLISH_PYPI=true   PUBLISH_NPM=true   PUBLISH_NUGET=true
# See RELEASING.md for the one-time setup of each registry.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Tag matches package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/check_versions.py "$GITHUB_REF_NAME"

  ci:
    name: Tests
    needs: verify
    uses: ./.github/workflows/ci.yml

  pypi:
    name: Publish to PyPI
    if: vars.PUBLISH_PYPI == 'true'
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sentrycove/
    permissions:
      id-token: write   # lets PyPI verify that this workflow is the publisher
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  npm:
    name: Publish to npm
    if: vars.PUBLISH_NPM == 'true'
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/sentrycove
    permissions:
      contents: read
      id-token: write   # lets npm verify that this workflow is the publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm must support trusted publishing (11.5.1 or newer)
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm $version"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$version"
      - run: npm ci
        working-directory: clients/node
      - name: Publish (skipped if this version is already on npm)
        working-directory: clients/node
        run: |
          set -euo pipefail
          package="$(node -p 'require("./package.json").name + "@" + require("./package.json").version')"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is already on npm (for example, published by hand); nothing to do."
          else
            npm publish --access public
          fi

  nuget:
    name: Publish to NuGet
    if: vars.PUBLISH_NUGET == 'true'
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/SentryCove.AspNetCore
    permissions:
      id-token: write   # lets nuget.org verify that this workflow is the publisher
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: nuget/
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Get a short-lived NuGet API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}   # your nuget.org user name (not your email)
      - name: Push the package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push nuget/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  image:
    name: Container image (${{ matrix.arch }})
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            -t "$image:$version-$ARCH" .
          docker push "$image:$version-$ARCH"

  image-manifest:
    name: Container image (multi-arch tag)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Publish the version and latest tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$version" -t "$image:latest" \
            "$image:$version-amd64" "$image:$version-arm64"

  github-release:
    name: GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create the release with the built packages attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "SentryCove ${GITHUB_REF_NAME#v}"
