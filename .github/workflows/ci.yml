name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the release workflow runs this whole suite before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit hashes (Dependabot keeps them current).

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      redis:   # the shared-state tests run against a real Redis server
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      SIGNALMOAT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples scripts
      - run: ruff format --check src tests examples scripts
      - run: mypy --ignore-missing-imports src
      - run: pytest -q

  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[server]"   # the tests start the real decision API
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: clients/node
      - run: npm test
        working-directory: clients/node

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[server]"   # the tests start the real decision API
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release clients/dotnet/src/SignalMoat.AspNetCore
      - run: dotnet run -c Release --project clients/dotnet/tests/SignalMoat.AspNetCore.Tests

  docker:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start the reverse-proxy example
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Smoke test through the proxy
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/_signalmoat/health
          # A normal request reaches the stand-in app.
          test "$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 Chrome/141' http://localhost:8080/)" = "200"
          # A decoy path raises an alert (monitor mode: observed, not blocked).
          curl -s -o /dev/null http://localhost:8080/.env
          sleep 1
          docker compose -f deploy/docker-compose.yml logs signalmoat | grep -q '"type": "honeypot_hit"'
          # The container must not run as root.
          test "$(docker compose -f deploy/docker-compose.yml exec -T signalmoat id -u)" = "10001"
      - name: Decision API mode starts and requires a token
        run: |
          set -euo pipefail
          SIGNALMOAT_API_TOKEN=ci-token-0123456789abcdef0123 \
            docker compose -f deploy/docker-compose.sidecar.yml up -d --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8787/_signalmoat/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:8787/v1/inspect)" = "401"
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml logs || true
          docker compose -f deploy/docker-compose.sidecar.yml logs || true

  package:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: All packages carry the same version
        run: python scripts/check_versions.py

      - name: Build the Python package
        run: |
          set -euo pipefail
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: The wheel installs and runs in a clean environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$(ls dist/*.whl)[server]"
          cd "$RUNNER_TEMP"
          ./venv/bin/signalmoat --version
          ./venv/bin/signalmoat check-config "$GITHUB_WORKSPACE/examples/signalmoat.yaml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build the npm package
        working-directory: clients/node
        run: |
          set -euo pipefail
          npm ci
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build the NuGet package
        run: dotnet pack -c Release clients/dotnet/src/SignalMoat.AspNetCore -o "$RUNNER_TEMP/nuget"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: ${{ runner.temp }}/nuget/
          if-no-files-found: error
          retention-days: 7
