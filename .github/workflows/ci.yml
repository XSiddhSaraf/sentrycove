name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: mypy --ignore-missing-imports src
      - run: pytest -q

  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[server]"   # the tests start the real decision API
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: clients/node
      - run: npm test
        working-directory: clients/node

  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[server]"   # the tests start the real decision API
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c Release clients/dotnet/src/SentryCove.AspNetCore
      - run: dotnet run -c Release --project clients/dotnet/tests/SentryCove.AspNetCore.Tests

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and start the reverse-proxy example
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 120
      - name: Smoke test through the proxy
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/_sentrycove/health
          # A normal request reaches the stand-in app.
          test "$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 Chrome/141' http://localhost:8080/)" = "200"
          # A decoy path raises an alert (monitor mode: observed, not blocked).
          curl -s -o /dev/null http://localhost:8080/.env
          sleep 1
          docker compose -f deploy/docker-compose.yml logs sentrycove | grep -q '"type": "honeypot_hit"'
          # The container must not run as root.
          test "$(docker compose -f deploy/docker-compose.yml exec -T sentrycove id -u)" = "10001"
      - name: Decision API mode starts and requires a token
        run: |
          set -euo pipefail
          SENTRYCOVE_API_TOKEN=ci-token-0123456789abcdef0123 \
            docker compose -f deploy/docker-compose.sidecar.yml up -d --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:8787/_sentrycove/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:8787/v1/inspect)" = "401"
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml logs || true
          docker compose -f deploy/docker-compose.sidecar.yml logs || true
