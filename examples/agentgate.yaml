# AgentGate policy — start in monitor mode, watch the alerts for a week,
# then switch to enforce.
version: 1
mode: monitor            # monitor = alert only | enforce = also block
fail_open: true          # if AgentGate itself errors, let traffic through
trusted_proxy_hops: 0    # set to 1 behind nginx / a load balancer, 2 behind CDN + LB

web_bot_auth:
  enabled: true
  # Signers whose key directories AgentGate may fetch. Only these origins
  # are ever contacted. Check each provider's documentation for the exact
  # Signature-Agent origin it uses before adding it here.
  trusted_agents: []
  #  - name: example-agent
  #    signature_agent: https://agent.example.com
  max_signature_age_seconds: 300
  require_nonce: false

# First matching rule wins. Agent selectors:
#   *  verified  declared  automation  unclassified  or kind:name (e.g. declared:GPTBot)
rules:
  - name: allow-verified-agents
    agents: [verified]
    action: allow

  - name: no-unverified-bots-on-forms
    paths: ["/login", "/signup", "/contact", "/checkout*", "/api/forms/*"]
    methods: [POST, PUT, PATCH]
    agents: [declared, automation]
    action: block
    severity: high

  - name: watch-scripts-on-api
    paths: ["/api/*"]
    agents: [automation]
    action: monitor
    severity: low

honeypots:
  enabled: true
  # Paths your app never serves. Remove any your app really uses.
  paths: ["/.env", "/.git/*", "/backup*", "/wp-login.php", "/phpmyadmin*", "/admin-old*"]
  ban_seconds: 3600
  response_status: 404

login:
  enabled: true
  paths: ["/login", "/api/auth/login"]
  failure_statuses: [401, 403]
  per_ip_threshold: 10
  global_threshold: 200
  window_seconds: 60

session:
  enabled: true
  cookie_names: ["session", "sessionid"]
  ttl_seconds: 86400
  alert_on_ip_change: false

alerts:
  cooldown_seconds: 300
  sinks:
    - type: log
      min_severity: low
    # URLs come from environment variables so secrets never sit in this file.
    # - type: slack
    #   url_env: AGENTGATE_SLACK_WEBHOOK
    #   min_severity: high
    # - type: webhook
    #   url_env: AGENTGATE_WEBHOOK_URL
    #   min_severity: medium
